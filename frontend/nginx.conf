server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Una SPA no tiene un archivo por ruta: cualquier path desconocido
    # devuelve index.html y el router del cliente decide que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
